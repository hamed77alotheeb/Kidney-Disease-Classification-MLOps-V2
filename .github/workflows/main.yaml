name: Project validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project files and configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install configuration validator
        run: python -m pip install PyYAML==6.0.2

      - name: Check Python syntax
        run: |
          python -c "import ast, pathlib; roots = [pathlib.Path('app.py'), pathlib.Path('main.py'), pathlib.Path('setup.py'), pathlib.Path('template.py')]; roots += [p for p in pathlib.Path('src').rglob('*.py') if '.ipynb_checkpoints' not in p.parts and '.backup' not in p.name]; [ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p)) for p in roots if p.is_file()]; print('Python syntax checks passed')"

      - name: Validate four-class configuration
        run: |
          python -c "import yaml; c = yaml.safe_load(open('config/config.yaml', encoding='utf-8')); assert c['data']['classes'] == ['Cyst', 'Normal', 'Stone', 'Tumor']; assert c['data']['num_classes'] == 4; print('Four-class configuration passed')"

      - name: Check command-line entry point
        run: python main.py --help
